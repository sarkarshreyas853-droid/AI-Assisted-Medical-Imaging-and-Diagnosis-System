name: Keep backend awake

# Pings the Render backend every 10 minutes so the free instance does not
# go to sleep, which makes the first analysis request very slow.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl -sS --max-time 90 https://nexvia-aiml-02-api.onrender.com/health
